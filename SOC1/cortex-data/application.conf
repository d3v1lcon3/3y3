# application.conf para o Cortex

# -------------------------------------------------------------------------------------------------------------
# Configurações do serviço de busca (Elasticsearch)
# -------------------------------------------------------------------------------------------------------------
search {
  backend = elasticsearch
  elasticsearch {
    # URL do seu Elasticsearch no SOC2
    # Certifique-se de que o IP 192.168.24.101 está correto para o seu servidor SOC2 e a porta 9200 está aberta.
    url = "http://192.168.24.101:9200"

    # Nome do cluster Elasticsearch (geralmente é "elasticsearch" ou "docker-cluster" por padrão)
    # Verifique isso acessando a URL do Elasticsearch no seu navegador (http://192.168.24.101:9200)
    clusterName = "hive" # Ou "elasticsearch" se for o padrão simples

    # Conexões simultâneas com o Elasticsearch
    maxConnections = 20
    maxConnectionsPerRoute = 10

    # Tempo limite para conexão e leitura (em milissegundos)
    connectTimeout = 5000
    readTimeout = 60000

    # Retries em caso de falha de conexão
    maxRetries = 5
  }
}

# -------------------------------------------------------------------------------------------------------------
# Configurações do Cortex
# -------------------------------------------------------------------------------------------------------------
cortex {
  # URL base da API do Cortex.
  # Se o TheHive está no mesmo host SOC1 e você mapeou a porta 9001:9001.
  # Use o IP do seu SOC1.
  url = "http://192.168.24.100:9001"

  # Nível de log (DEBUG, INFO, WARN, ERROR)
  log.level = INFO

  # Configurações para a execução de jobs (Analisadores e Responders)
  jobs {
    directory = "/tmp/cortex-jobs" # Diretório temporário para jobs
    docker {
      directory = "/tmp/cortex-jobs" # Diretório temporário dentro do Docker
      # Assegure-se que o volume - /var/run/docker.sock:/var/run/docker.sock está no docker-compose.yml
    }
  }

  # Limites de recursos para os analisadores
  limits {
    cpu = "1.0" # Limite de CPU para cada analisador (ex: 1.0 CPU core)
    memory = "1G" # Limite de memória para cada analisador (ex: 1GB)
    timeout = 180000 # Tempo limite padrão para analisadores (em milissegundos)
  }

  # Configurações de autenticação (se for usar API Keys, LDAP, etc.)
  # Deixe em branco se você não estiver usando autenticação via API Key
  # apiKeys = {
  #   "your-api-key-name" = "your-api-key-hash"
  # }

  # Configuração para autenticação LDAP/AD (descomente e configure se for usar)
  # ldap {
  #   enabled = false
  #   url = "ldap://your-ldap-server:389"
  #   # ... outras configs LDAP
  # }
}

# -------------------------------------------------------------------------------------------------------------
# Configurações do Play Framework (base do Cortex)
# -------------------------------------------------------------------------------------------------------------
play {
  # Configurações HTTP do Play
  server {
    # Portas para o servidor HTTP
    http {
      port = 9001 # A porta principal da API do Cortex
    }
    # HTTPS (descomente e configure se for usar HTTPS)
    # https {
    #   port = 9443
    #   ssl {
    #     keyStore.path = "conf/certs/server.jks"
    #     keyStore.password = "password"
    #   }
    # }
  }

  # Filtros HTTP
  # http.filters.enabled = true
  # http.filters.hosts {
  #   allowed = ["127.0.0.1", "localhost", "192.168.24.100"]
  # }
}

# -------------------------------------------------------------------------------------------------------------
# Configurações de logging (logback)
# -------------------------------------------------------------------------------------------------------------
logger {
  # Root logger: nivel de log padrão para toda a aplicação
  root = "INFO"
  # Loggers específicos para alguns módulos do Cortex
  "com.sksamuel.elastic4s" = "WARN" # Reduz logs verbosos do cliente Elasticsearch
  "akka" = "WARN" # Reduz logs verbosos do Akka (framework)
  "org.elasticsearch" = "WARN" # Reduz logs verbosos do Elasticsearch
  "org.hibernate" = "WARN"
}

# -------------------------------------------------------------------------------------------------------------
# Configurações do Akka (framework de concorrência)
# -------------------------------------------------------------------------------------------------------------
akka {
  loglevel = "INFO"
  stdout-loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  cluster {
    # Esse é o objeto que ${akka.cluster.distributed-data} espera
    distributed-data = {
      gossip-interval = 1s
      notify-subscribers-interval = 500 ms
      pruning-interval = 120 s
      max-delta-elements = 3000
      durable {
        keys = []
      }
    }
  }
}
