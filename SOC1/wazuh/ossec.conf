<!--
  Wazuh - Manager - Default configuration
-->

<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>

    <!-- E-mail (desabilitado, mas configurado) -->
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>

    <!-- Tempo até considerar agente desconectado -->
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Logs do próprio Wazuh Manager -->
  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- Comunicação entre manager e agentes -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <!-- Regras, decoders e listas -->
  <ruleset>
    <decoder_dir>/var/ossec/etc/decoders</decoder_dir>
    <decoder_dir>/var/ossec/etc/decoders/custom</decoder_dir>

    <rules_dir>/var/ossec/etc/rules</rules_dir>
    <rules_dir>/var/ossec/etc/rules/custom</rules_dir>

    <list>etc/lists/audit-keys</list>
  </ruleset>

  <!-- Monitoração de integridade -->
  <syscheck>
    <frequency>43200</frequency>

    <directories check_all="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/usr/bin</directories>
    <directories check_all="yes" realtime="yes">/usr/sbin</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
  </syscheck>

  <!-- Rootcheck (hardening e políticas de segurança) -->
  <rootcheck>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- Logs locais importantes -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Active-response: comandos de resposta automática -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <level>6</level>
  </active-response>

  <!-- Cluster desligado (a menos que você use multi-node) -->
  <cluster>
    <disabled>yes</disabled>
  </cluster>

</ossec_config>
